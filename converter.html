<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML to Excel - Tally Suite</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Permanent Locked Sidebar Injector via sidebar.js -->
<main class="main-content">
  <div class="app-container">
    
    <div class="dashboard-header">
      <div style="display: flex; align-items: center; gap: 14px;">
        <button class="sidebar-toggle-btn" id="sidebarToggle" title="Toggle Sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div>
          <h1>XML to Excel Converter</h1>
          <p>Transform Tally XML exports into structured spreadsheets</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="sync-badge"><span></span> Live Sync</div>
      </div>
    </div>

    <div class="card">
      <div class="step-box">
        <span style="color:#334155; font-weight: 600;">Transform Tally XML exports into structured Debit & Credit spreadsheets</span>
      </div>
      <div class="dropzone" onclick="document.getElementById('xmlFile').click()">
        <input type="file" id="xmlFile" accept=".xml" onchange="fileSelected('xmlFile', 'xmlFileName')" style="display: none;" />
        <div class="icon"><i class="fa-solid fa-file-code"></i></div>
        <div class="msg">Select Tally XML File (Click or Drag & Drop File Here)</div>
        <div id="xmlFileName" class="file-name" style="margin-top: 8px; font-weight: 600; color: #059669;"></div>
      </div>
      <button class="btn-action blue" onclick="convertXmlToExcel()"><i class="fa-solid fa-file-excel"></i> Convert XML to Excel</button>
      <div id="previewContainer" class="preview-table-box" style="margin-top: 15px;">
        <table id="previewTable"><thead></thead><tbody></tbody></table>
      </div>
      <div id="alertBox" class="alert" style="margin-top: 15px;"></div>
    </div>

  </div>
</main>

<script src="sidebar.js"></script>
<script src="app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const username = localStorage.getItem('client_username');
    if (!username) { window.location.href = 'index.html'; }
    const sidebarToggle = document.getElementById('sidebarToggle');
    if (sidebarToggle) {
      sidebarToggle.addEventListener('click', () => {
        document.body.classList.toggle('sidebar-collapsed');
      });
    }
  });
</script>
</body>
</html>
