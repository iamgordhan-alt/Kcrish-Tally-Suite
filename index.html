<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kcrish Tally Suite - Login</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #5835df;
      --primary-hover: #4729c6;
      --card-bg: #ffffff;
      --text: #1e1b4b;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95);
      margin: 0; 
      min-height: 100vh;
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
      color: var(--text);
      position: relative;
      overflow: hidden;
    }

    /* BACKGROUND BLURRED LOGO WATERMARK */
    .bg-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background-image: url('logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: blur(40px);
      opacity: 0.12;
      z-index: 0;
      pointer-events: none;
    }

    .auth-card {
      position: relative;
      z-index: 1;
      width: 100%; 
      max-width: 440px; 
      background: var(--card-bg);
      padding: 40px 36px; 
      border-radius: var(--radius);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border); 
      text-align: center;
    }

    .brand-logo-container {
      margin-bottom: 20px;
    }
    .brand-logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 4px 0;
    }
    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 24px 0;
    }

    .social-btns { display: flex; gap: 12px; margin-bottom: 20px; }
    .btn-social {
      flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 12px;
      background: white; cursor: pointer; font-size: 16px; display: flex; justify-content: center; align-items: center;
      transition: background 0.2s;
    }
    .btn-social:hover { background: #f9fafb; border-color: #d1d5db; }
    .btn-social.google { color: #ea4335; }
    .btn-social.facebook { background: #1877f2; color: white; border-color: #1877f2; }

    .divider {
      display: flex; align-items: center; text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
    .divider::before { margin-right: 12px; } .divider::after { margin-left: 12px; }

    .input-field-group { text-align: left; margin-bottom: 16px; }
    .input-field-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .input-wrapper input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; background: #fff;
    }
    .input-wrapper input:focus { border-color: var(--primary); }
    .toggle-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; }

    .forgot-link-box { text-align: left; margin-bottom: 20px; }
    .forgot-link-box a { color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 600; }
    .forgot-link-box a:hover { text-decoration: underline; }

    .btn-main {
      width: 100%; background: var(--primary); color: white; border: none; padding: 13px;
      border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 20px;
      transition: background 0.2s;
    }
    .btn-main:hover { background: var(--primary-hover); }

    .auth-footer-links { font-size: 13px; color: var(--text-muted); display: flex; flex-direction: column; gap: 8px; }
    .auth-footer-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .auth-footer-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- BACKGROUND BLURRED LOGO WATERMARK -->
  <div class="bg-watermark"></div>

<div class="auth-card">
  <div class="brand-logo-container">
    <img src="logo.png" alt="Logo" class="brand-logo-img" onerror="this.style.display='none'" />
    <h1 class="brand-title">Kcrish Tally Suite</h1>
    <p class="brand-subtitle">Sign in to your automation portal</p>
  </div>

  <div class="social-btns">
    <button class="btn-social google" onclick="handleGoogleLogin()" title="Sign in with Google"><i class="fa-brands fa-google"></i></button>
    <button class="btn-social facebook" onclick="alert('Facebook login feature.')" title="Sign in with Facebook"><i class="fa-brands fa-facebook-f"></i></button>
  </div>

  <div class="divider">or sign in with email</div>

  <div class="input-field-group">
    <label>Email address</label>
    <div class="input-wrapper">
      <input type="email" id="loginEmail" placeholder="name@example.com" />
    </div>
  </div>

  <div class="input-field-group" style="margin-bottom: 8px;">
    <label>Password</label>
    <div class="input-wrapper">
      <input type="password" id="loginPassword" placeholder="••••••••" />
      <i class="fa-solid fa-eye toggle-password" id="togglePassBtn" onclick="togglePasswordVisibility()"></i>
    </div>
  </div>

  <div class="forgot-link-box">
    <a href="#" onclick="alert('Password reset instructions sent.'); return false;">Forgot password?</a>
  </div>

  <button class="btn-main" onclick="handleGoogleLogin()">Log in</button>

  <div class="auth-footer-links">
    <a href="#" onclick="alert('Please use Google Sign-in to link your personal Drive.'); return false;">Can't Access Your Account?</a>
    <div>Don't have an account? <a href="signup.html">Sign Up</a></div>
  </div>
</div>

<script>
const CLIENT_ID = "306902298167-6o9o8o84955pu92k5k07u5al7djhp6op.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/drive.file";

let tokenClient;

window.onload = function() {
  let savedToken = localStorage.getItem("google_access_token");
  if(savedToken) {
    window.location.href = "dashboard.html";
  }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (response) => {
      if (response.error !== undefined) {
        alert("Google Authentication failed!");
        return;
      }
      localStorage.setItem("google_access_token", response.access_token);
      let emailVal = document.getElementById("loginEmail").value || "Google User";
      localStorage.setItem("client_username", emailVal);
      window.location.href = "dashboard.html";
    },
  });
};

function togglePasswordVisibility() {
  let passInput = document.getElementById("loginPassword");
  let eyeBtn = document.getElementById("togglePassBtn");
  if (passInput.type === "password") {
    passInput.type = "text";
    eyeBtn.className = "fa-solid fa-eye-slash toggle-password";
  } else {
    passInput.type = "password";
    eyeBtn.className = "fa-solid fa-eye toggle-password";
  }
}

function handleGoogleLogin() {
  tokenClient.requestAccessToken({ prompt: 'consent' });
}
</script>
</body>
</html>
