<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kcrish Excel to Tally Automation - Portal</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-green: #10b981;
      --primary-green-hover: #059669;
      --card-glass: rgba(30, 41, 59, 0.7);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text-dark: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #090d16;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: var(--text-dark);
      position: relative;
      overflow-x: hidden;
    }

    /* ANIMATED PORTAL CONTAINER */
    .portal-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1050px;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-glass);
      display: flex;
      overflow: hidden;
      animation: pageSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pageSlideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* LEFT PANE (LOGO SHOWCASE) */
    .left-pane {
      flex: 1;
      background: rgba(15, 23, 42, 0.4);
      border-right: 1px solid var(--border-glass);
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .logo-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.4s ease;
    }
    .logo-box:hover { transform: scale(1.03); }

    .logo-img {
      max-width: 100%;
      height: auto;
      max-height: 240px;
      object-fit: contain;
    }

    /* RIGHT PANE (LOGIN FORM) */
    .right-pane {
      flex: 1;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 18px;
      width: fit-content;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge span { width: 8px; height: 8px; background: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; }

    h2 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 6px 0;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 28px 0;
      line-height: 1.5;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 13px 14px 13px 40px;
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: rgba(15, 23, 42, 0.6);
      color: #ffffff;
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus { 
      border-color: var(--primary-green); 
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); 
    }

    .input-wrapper i.icon-prefix {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .input-wrapper i.toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      transition: color 0.2s;
    }
    .input-wrapper i.toggle-password:hover { color: #ffffff; }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .form-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .form-options input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary-green); cursor: pointer; }

    .form-options a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .form-options a:hover { color: #93c5fd; text-decoration: underline; }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #047857);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
    }
    .btn-submit:hover { 
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.45);
      filter: brightness(1.1); 
    }

    .divider-auth {
      text-align: center;
      border-bottom: 1px solid var(--border-glass);
      line-height: 0.1em;
      margin: 32px 0 22px 0;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .divider-auth span { background: #1e293b; padding: 0 12px; border-radius: 4px; }

    .footer-security {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .footer-security .secure-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      font-weight: 500;
    }

    @media(max-width: 768px) {
      .portal-container { flex-direction: column; }
      .left-pane { padding: 36px 20px; }
      .right-pane { padding: 36px 24px; }
    }
  </style>
</head>
<body>

  <div class="portal-container">
    
    <!-- LEFT PANE: OFFICIAL LOGO -->
    <div class="left-pane">
      <div class="logo-box">
        <img src="logo.png" alt="Kcrish Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/200?text=Kcrish+Logo'" />
      </div>
    </div>

    <!-- RIGHT PANE: LOGIN FORM & GOOGLE SYNC -->
    <div class="right-pane">
      <div class="badge"><span></span> Secure Business Portal</div>
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to continue to your Kcrish Excel to Tally Automation workspace.</p>

      <div class="input-group">
        <label>Username / Email</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user icon-prefix"></i>
          <input type="text" id="loginEmail" placeholder="Enter your username or email" autocomplete="off" />
        </div>
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock icon-prefix"></i>
          <input type="password" id="loginPassword" placeholder="Enter your password" />
          <i class="fa-solid fa-eye toggle-password" id="togglePassBtn" onclick="togglePasswordVisibility()"></i>
        </div>
      </div>

      <div class="form-options">
        <label><input type="checkbox" /> Remember me</label>
        <a href="#" onclick="alert('Password reset instructions sent.'); return false;">Forgot password?</a>
      </div>

      <button class="btn-submit" onclick="handleGoogleLogin()">Sign in to Portal</button>

      <div class="divider-auth"><span>Authorized Access</span></div>

      <div class="footer-security">
        <div class="secure-row"><i class="fa-solid fa-shield-halved" style="color:#34d399;"></i> Secure login • Your account is protected</div>
        <div>© 2026 Kcrish • Excel to Tally Automation</div>
      </div>
    </div>

  </div>

<script>
const CLIENT_ID = "306902298167-6o9o8o84955pu92k5k07u5al7djhp6op.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/drive.file";

let tokenClient;

window.onload = function() {
  let savedToken = localStorage.getItem("google_access_token");
  if(savedToken) {
    window.location.href = "dashboard.html";
  }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (response) => {
      if (response.error !== undefined) {
        alert("Google Authentication failed!");
        return;
      }
      localStorage.setItem("google_access_token", response.access_token);
      let userVal = document.getElementById("loginEmail").value.trim() || "Kcrish User";
      localStorage.setItem("client_username", userVal);
      window.location.href = "dashboard.html";
    },
  });
};

function togglePasswordVisibility() {
  let passInput = document.getElementById("loginPassword");
  let eyeBtn = document.getElementById("togglePassBtn");
  if (passInput.type === "password") {
    passInput.type = "text";
    eyeBtn.className = "fa-solid fa-eye-slash toggle-password";
  } else {
    passInput.type = "password";
    eyeBtn.className = "fa-solid fa-eye toggle-password";
  }
}

function handleGoogleLogin() {
  tokenClient.requestAccessToken({ prompt: 'consent' });
}
</script>
</body>
</html>
