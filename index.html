<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Kcrish Automation Suite - Secure Client Login">
<meta name="theme-color" content="#061219">
<title>Kcrish Workspace • Secure Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary: #10b981;
  --primary-hover: #059669;
  --primary-light: #34d399;
  --cyan: #06b6d4;
  --bg-dark: #061118;
  --bg-card: rgba(12, 26, 36, 0.85);
  --border-card: rgba(255, 255, 255, 0.12);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-main);
  background-color: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: 
    radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
    linear-gradient(135deg, #040d12 0%, #081620 100%);
  background-attachment: fixed;
  padding: 20px;
}

.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 24px;
  padding: 40px;
  width: 100%;
  max-width: 440px;
  backdrop-filter: blur(25px);
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
  text-align: center;
}

.brand-logo-large {
  width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg, #10b981, #06b6d4);
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: #022c22;
  margin: 0 auto 16px; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
}

.login-card h2 {
  font-size: 22px; color: #fff; margin-bottom: 6px; font-weight: 700;
}
.login-card p {
  font-size: 13px; color: var(--text-muted); margin-bottom: 28px;
}

.input-group {
  text-align: left; margin-bottom: 18px;
}
.input-group label {
  display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px;
}
.input-field {
  width: 100%; height: 48px; background: rgba(3, 14, 23, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px; padding: 0 16px; color: #fff; font-size: 14px; font-family: var(--font-main);
  transition: all 0.2s;
}
.input-field:focus {
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
}

.btn-login {
  width: 100%; height: 48px; border-radius: 12px; border: none; background: linear-gradient(135deg, #34d399, #10b981);
  color: #022c22; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 10px;
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
}
.btn-login:hover {
  transform: translateY(-2px); box-shadow: 0 15px 25px rgba(16, 185, 129, 0.35);
}

.error-msg {
  background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;
  padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 16px; display: none; text-align: left;
}

.login-footer {
  margin-top: 24px; font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 16px;
}
.login-footer a {
  color: var(--cyan); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; transition: color 0.2s;
}
.login-footer a:hover {
  color: #38bdf8; text-decoration: underline;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-logo-large">KA</div>
  <h2>Kcrish Automation Suite</h2>
  <p>Secure Enterprise Workspace Login</p>

  <div class="error-msg" id="errorBox">Please enter a valid username.</div>

  <form id="loginForm">
    <div class="input-group">
      <label for="usernameInput">Client Username / ID</label>
      <input type="text" id="usernameInput" class="input-field" placeholder="Enter your username..." required autocomplete="off">
    </div>

    <button type="submit" class="btn-login">
      <i class="fa-solid fa-right-to-bracket"></i> Launch Workspace
    </button>
  </form>

  <div class="login-footer">
    <span>© Kcrish Systems</span>
    <a href="about.html"><i class="fa-solid fa-circle-info"></i> About</a>
  </div>
</div>

<script>
  // Redirect if already logged in
  if (localStorage.getItem('client_username')) {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const username = document.getElementById('usernameInput').value.trim();
    const errorBox = document.getElementById('errorBox');

    if (!username || username.length < 2) {
      errorBox.textContent = 'Please enter a valid username (at least 2 characters).';
      errorBox.style.display = 'block';
      return;
    }

    // Save session data
    localStorage.setItem('client_username', username);
    localStorage.setItem('active_user_folder', `/Kcrish_Data/Users/${username.replace(/\s+/g, '_')}/`);
    
    // Redirect to dashboard
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
