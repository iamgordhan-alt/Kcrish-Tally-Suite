<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Item Master - Tally Suite</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: #34d399;
      --cyan: #06b6d4;
      --bg-dark: #061118;
      --bg-card: rgba(12, 26, 36, 0.75);
      --border-card: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(6, 182, 212, 0.1) 0%, transparent 40%),
        linear-gradient(180deg, #050e14 0%, #081620 100%);
      background-attachment: fixed;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
      overflow-x: hidden;
    }

    body.page-loaded { opacity: 1; transform: translateY(0); }
    body.page-exiting { opacity: 0; transform: translateY(-8px); }

    .main-content {
      margin-left: 260px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-y: auto;
      transition: margin-left 0.3s ease;
    }
    body.sidebar-collapsed .main-content { margin-left: 72px; }

    .top-bar-header {
      background: rgba(10, 22, 31, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .top-bar-left { display: flex; align-items: center; gap: 16px; }
    .sidebar-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      width: 36px; height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .sidebar-toggle-btn:hover { background: rgba(255, 255, 255, 0.12); }

    .top-bar-title h1 { font-size: 18px; font-weight: 800; color: #fff; }
    .top-bar-title p { font-size: 12px; color: var(--text-muted); }

    .live-sync-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px;
      background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7; font-size: 11px; font-weight: 700;
    }
    .live-sync-badge span { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 8px var(--primary); }

    .content-body { padding: 28px; display: flex; flex-direction: column; gap: 24px; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .step-box {
      display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; color: var(--text-muted);
      background: rgba(3, 14, 23, 0.5); padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-template {
      background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.3); color: #67e8f9;
      padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .btn-template:hover { background: rgba(6, 182, 212, 0.25); color: #fff; }

    .dropzone {
      border: 2px dashed rgba(255,255,255,0.15); border-radius: 16px; padding: 36px; text-align: center;
      background: rgba(3, 14, 23, 0.6); cursor: pointer; transition: all 0.2s;
    }
    .dropzone:hover { border-color: var(--primary); background: rgba(16, 185, 129, 0.04); }
    .dropzone .icon { font-size: 36px; color: var(--primary-light); margin-bottom: 12px; }
    .dropzone .msg { font-size: 14px; font-weight: 600; color: #fff; }

    .btn-action {
      background: linear-gradient(135deg, #34d399, #10b981); color: #022c22; padding: 14px 20px; border-radius: 14px;
      font-weight: 800; font-size: 14.5px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3); transition: all 0.2s; width: 100%;
    }
    .btn-action:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4); }
    .alert { padding: 12px 16px; border-radius: 10px; font-size: 13.5px; display: none; }
  </style>
</head>
<body>

<main class="main-content">
  <header class="top-bar-header">
    <div class="top-bar-left">
      <button class="sidebar-toggle-btn" id="sidebarToggle" title="Toggle Sidebar">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="top-bar-title">
        <h1>Item Stock Master</h1>
        <p>Manage Inventory and Stock Items with Custom Units &amp; Ratios</p>
      </div>
    </div>
    <div class="top-bar-right">
      <div class="live-sync-badge"><span></span> Live Sync</div>
    </div>
  </header>

  <div class="content-body">
    <div class="card">
      <div class="step-box">
        <span>Download standard inventory stock item master template:</span>
        <button class="btn-template" onclick="downloadMasterTemplate()"><i class="fa-solid fa-download"></i> Template</button>
      </div>
      <div class="dropzone" onclick="document.getElementById('masterExcelFile').click()">
        <input type="file" id="masterExcelFile" accept=".xlsx, .xls" onchange="fileSelected('masterExcelFile', 'masterFileName')" style="display: none;" />
        <div class="icon"><i class="fa-solid fa-boxes-packing"></i></div>
        <div class="msg">Upload Stock Inventory (Click or Drag &amp; Drop File Here)</div>
        <div id="masterFileName" class="file-name" style="margin-top: 8px; font-weight: 600; color: #34d399;"></div>
      </div>
      <button class="btn-action" onclick="generateMasterXML()"><i class="fa-solid fa-bolt"></i> Generate Item Master XML &amp; Sync</button>
      <div id="alertBox" class="alert" style="margin-top: 15px;"></div>
    </div>
  </div>
</main>

<script src="sidebar.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => { document.body.classList.add("page-loaded"); }, 40);
    const username = localStorage.getItem('client_username');
    if (!username) { window.location.href = 'index.html'; }
    const sidebarToggle = document.getElementById('sidebarToggle');
    if (sidebarToggle) {
      sidebarToggle.addEventListener('click', () => {
        document.body.classList.toggle('sidebar-collapsed');
      });
    }
  });

  function fileSelected(inputId, nameId) {
    const fileInput = document.getElementById(inputId);
    const fileNameDiv = document.getElementById(nameId);
    if (fileInput.files && fileInput.files[0]) {
      fileNameDiv.textContent = "Selected File: " + fileInput.files[0].name;
    }
  }

  // Template jisme columns ka exact sequence aapke latest image ke anusaar set kar diya gaya hai:
  // 1. Item Name, 2. Part Number, 3. Group, 4. Category, 5. Base Unit, 6. Alternate Unit, 7. Qty In Box, 8. Qty of base unit in alternate unit
  function downloadMasterTemplate() {
    const templateData = [
      {
        "Item Name": "Tuborg Strong Beer (650 ML)",
        "Part Number": "TBS650",
        "Group": "English",
        "Category": "650",
        "Base Unit": "ml",
        "Alternate Unit": "Case of Btl 12",
        "Qty In Box": 650,
        "Qty of base unit in alternate unit": 1
      }
    ];

    const worksheet = XLSX.utils.json_to_sheet(templateData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Item Master");
    XLSX.writeFile(workbook, "Item_Master_Template.xlsx");
  }

  function generateMasterXML() {
    const fileInput = document.getElementById('masterExcelFile');
    const alertBox = document.getElementById('alertBox');

    if (!fileInput.files || fileInput.files.length === 0) {
      alertBox.style.display = 'block';
      alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
      alertBox.style.color = '#fca5a5';
      alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
      alertBox.textContent = 'Please select or upload an Excel file first!';
      return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function (e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

        if (rows.length === 0) {
          throw new Error("The uploaded Excel file is empty.");
        }

        let xmlContent = `<ENVELOPE>\n`;
        xmlContent += `  <HEADER>\n`;
        xmlContent += `    <TALLYREQUEST>Import Data</TALLYREQUEST>\n`;
        xmlContent += `  </HEADER>\n`;
        xmlContent += `  <BODY>\n`;
        xmlContent += `    <IMPORTDATA>\n`;
        xmlContent += `      <REQUESTDESC>\n`;
        xmlContent += `        <REPORTNAME>Stock Item</REPORTNAME>\n`;
        xmlContent += `      </REQUESTDESC>\n`;
        xmlContent += `      <REQUESTDATA>\n`;

        rows.forEach(row => {
          const keys = Object.keys(row);
          
          const itemName = row[keys[0]] || '';
          const partNo = row[keys[1]] || '';
          const group = row[keys[2]] || 'Primary';
          const category = row[keys[3]] || '';
          const baseUnit = row[keys[4]] || 'Nos';
          const altUnit = String(row[keys[5]] || '').trim();
          
          // Naye sequence ke anusaar index mapping:
          // Index 6 -> Qty In Box (Conversion factor)
          // Index 7 -> Qty of base unit in alternate unit (Denominator)
          const qtyInBox = parseFloat(row[keys[6]]) || 0; 
          const ratioVal = parseFloat(row[keys[7]]) || 1;  

          if (!itemName) return;

          xmlContent += `        <TALLYMESSAGE>\n`;
          xmlContent += `          <STOCKITEM NAME="${itemName}" ACTION="Create">\n`;
          xmlContent += `            <NAME>${itemName}</NAME>\n`;
          xmlContent += `            <PARENT>${group}</PARENT>\n`;
          xmlContent += `            <CATEGORY>${category}</CATEGORY>\n`;
          xmlContent += `            <BASEUNITS>${baseUnit}</BASEUNITS>\n`;

          if (altUnit && qtyInBox > 0) {
            xmlContent += `            <ADDITIONALUNITS>${altUnit}</ADDITIONALUNITS>\n`;
            xmlContent += `            <DENOMINATOR>${ratioVal}</DENOMINATOR>\n`;
            xmlContent += `            <CONVERSION>${qtyInBox}</CONVERSION>\n`;
          }

          if (partNo) {
            xmlContent += `            <DESCRIPTION>${partNo}</DESCRIPTION>\n`;
          }

          xmlContent += `          </STOCKITEM>\n`;
          xmlContent += `        </TALLYMESSAGE>\n`;
        });

        xmlContent += `      </REQUESTDATA>\n`;
        xmlContent += `    </IMPORTDATA>\n`;
        xmlContent += `  </BODY>\n`;
        xmlContent += `</ENVELOPE>`;

        const blob = new Blob([xmlContent], { type: 'application/xml;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "Item_Master_Sync.xml";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
        alertBox.style.color = '#6ee7b7';
        alertBox.style.border = '1px solid rgba(16, 185, 129, 0.3)';
        alertBox.textContent = 'Item Master XML generated successfully with exact column sequence matching your image!';

      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.color = '#fca5a5';
        alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
        alertBox.textContent = 'Error parsing file: ' + err.message;
      }
    };

    reader.readAsArrayBuffer(file);
  }
</script>
</body>
</html>
