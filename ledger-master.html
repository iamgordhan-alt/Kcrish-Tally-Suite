<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>General Ledger Master - Tally Suite</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: #34d399;
      --cyan: #06b6d4;
      --bg-dark: #061118;
      --bg-card: rgba(12, 26, 36, 0.75);
      --border-card: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(6, 182, 212, 0.1) 0%, transparent 40%),
        linear-gradient(180deg, #050e14 0%, #081620 100%);
      background-attachment: fixed;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
      overflow-x: hidden;
    }

    body.page-loaded { opacity: 1; transform: translateY(0); }
    body.page-exiting { opacity: 0; transform: translateY(-8px); }

    /* Main Content Area */
    .main-content {
      margin-left: 260px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-y: auto;
      transition: margin-left 0.3s ease;
    }
    body.sidebar-collapsed .main-content { margin-left: 72px; }

    .top-bar-header {
      background: rgba(10, 22, 31, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .top-bar-left { display: flex; align-items: center; gap: 16px; }
    .sidebar-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      width: 36px; height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .sidebar-toggle-btn:hover { background: rgba(255, 255, 255, 0.12); }

    .top-bar-title h1 { font-size: 18px; font-weight: 800; color: #fff; }
    .top-bar-title p { font-size: 12px; color: var(--text-muted); }

    .live-sync-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px;
      background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7; font-size: 11px; font-weight: 700;
    }
    .live-sync-badge span { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 8px var(--primary); }

    .content-body { padding: 28px; display: flex; flex-direction: column; gap: 24px; }

    /* Glassmorphic Card Layout matching style.css */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .step-box {
      display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; color: var(--text-muted);
      background: rgba(3, 14, 23, 0.5); padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-template {
      background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.3); color: #67e8f9;
      padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .btn-template:hover { background: rgba(6, 182, 212, 0.25); color: #fff; }

    .dropzone {
      border: 2px dashed rgba(255,255,255,0.15); border-radius: 16px; padding: 36px; text-align: center;
      background: rgba(3, 14, 23, 0.6); cursor: pointer; transition: all 0.2s;
    }
    .dropzone:hover { border-color: var(--primary); background: rgba(16, 185, 129, 0.04); }
    .dropzone .icon { font-size: 36px; color: var(--primary-light); margin-bottom: 12px; }
    .dropzone .msg { font-size: 14px; font-weight: 600; color: #fff; }

    .btn-action {
      background: linear-gradient(135deg, #34d399, #10b981); color: #022c22; padding: 14px 20px; border-radius: 14px;
      font-weight: 800; font-size: 14.5px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3); transition: all 0.2s; width: 100%;
    }
    .btn-action:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4); }
    .alert { padding: 12px 16px; border-radius: 10px; font-size: 13px; display: none; }
  </style>
</head>
<body>

<!-- Permanent Locked Sidebar Injector via sidebar.js -->
<main class="main-content">
  <header class="top-bar-header">
    <div class="top-bar-left">
      <button class="sidebar-toggle-btn" id="sidebarToggle" title="Toggle Sidebar">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="top-bar-title">
        <h1>General Ledger Master</h1>
        <p>Manage Accounts and Ledgers</p>
      </div>
    </div>
    <div class="top-bar-right">
      <div class="live-sync-badge"><span></span> Live Sync</div>
    </div>
  </header>

  <div class="content-body">
    <div class="card">
      <div class="step-box">
        <span>Download general ledger master template:</span>
        <button class="btn-template" onclick="downloadLedgerTemplate()"><i class="fa-solid fa-download"></i> Template</button>
      </div>
      <div class="dropzone" onclick="document.getElementById('ledgerExcelFile').click()">
        <input type="file" id="ledgerExcelFile" accept=".xlsx, .xls" onchange="fileSelected('ledgerExcelFile', 'ledgerFileName')" style="display: none;" />
        <div class="icon"><i class="fa-solid fa-address-card"></i></div>
        <div class="msg">Upload Ledger Spreadsheet (Click or Drag &amp; Drop File Here)</div>
        <div id="ledgerFileName" class="file-name" style="margin-top: 8px; font-weight: 600; color: #34d399;"></div>
      </div>
      <button class="btn-action" onclick="generateLedgerXML()"><i class="fa-solid fa-bolt"></i> Generate Ledger XML &amp; Sync</button>
      <div id="alertBox" class="alert" style="margin-top: 15px;"></div>
    </div>
  </div>
</main>

<script src="sidebar.js"></script>
<script src="app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => { document.body.classList.add("page-loaded"); }, 40);
    const username = localStorage.getItem('client_username');
    if (!username) { window.location.href = 'index.html'; }
    const sidebarToggle = document.getElementById('sidebarToggle');
    if (sidebarToggle) {
      sidebarToggle.addEventListener('click', () => {
        document.body.classList.toggle('sidebar-collapsed');
      });
    }
  });
</script>
</body>
</html>
