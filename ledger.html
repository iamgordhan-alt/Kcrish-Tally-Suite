<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>General Ledger - Tally Suite</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Permanent Locked Sidebar Injector via sidebar.js -->
<main class="main-content">
  <div class="app-container">
    
    <div class="dashboard-header">
      <div style="display: flex; align-items: center; gap: 14px;">
        <button class="sidebar-toggle-btn" id="sidebarToggle" title="Toggle Sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div>
          <h1>General Ledger Master</h1>
          <p>Manage Accounts and Ledgers</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="sync-badge"><span></span> Live Sync</div>
      </div>
    </div>

    <div class="card">
      <div class="step-box">
        <span>Download general ledger master template:</span>
        <button class="btn-template" onclick="downloadLedgerTemplate()"><i class="fa-solid fa-download"></i> Template</button>
      </div>
      <div class="dropzone" onclick="document.getElementById('ledgerExcelFile').click()">
        <input type="file" id="ledgerExcelFile" accept=".xlsx, .xls" onchange="fileSelected('ledgerExcelFile', 'ledgerFileName')" />
        <div class="icon"><i class="fa-solid fa-address-card"></i></div>
        <div class="msg">Upload Ledger Spreadsheet (Click or Drag & Drop File Here)</div>
        <div id="ledgerFileName" class="file-name"></div>
      </div>
      <button class="btn-action" onclick="generateLedgerXML()"><i class="fa-solid fa-bolt"></i> Generate Ledger XML & Sync</button>
      <div id="alertBox" class="alert"></div>
    </div>

  </div>
</main>

<script src="sidebar.js"></script>
<script src="app.js"></script>
<script>
  // Session check and sidebar toggle handler
  document.addEventListener("DOMContentLoaded", () => {
    const username = localStorage.getItem('client_username');
    if (!username) {
      window.location.href = 'index.html';
    }

    const sidebarToggle = document.getElementById('sidebarToggle');
    if (sidebarToggle) {
      sidebarToggle.addEventListener('click', () => {
        document.body.classList.toggle('sidebar-collapsed');
      });
    }
  });
</script>
</body>
</html>
